spring.application.name=fincorehub
spring.main.banner-mode=off


spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FINCOREHUB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}



spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.servlet.context-path=/fincorehub


# Swagger
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs
#springdoc.swagger-ui.operationsSorter=alpha
#springdoc.swagger-ui.tagsSorter=alpha
#springdoc.swagger-ui.display-request-duration=true
#springdoc.swagger-ui.doc-expansion=list
#springdoc.swagger-ui.enabled=true
#springdoc.api-docs.enabled=true
#springdoc.packages-to-scan=com.resustainability.fincorehub.controller


# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.web.resources.static-locations=classpath:/static/

server.port=8012


