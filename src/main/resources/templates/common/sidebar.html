<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        #sidebar { min-width: 250px; max-width: 250px; min-height: 100vh; background: #2c3e50; color: #fff; position: fixed; z-index: 1000; }
        #sidebar .sidebar-header { 
            padding: 15px; 
            background: #1a252f; 
            display: flex;
            justify-content: center; 
            align-items: center;     
            width: 100%;             
        }

        #sidebar .sidebar-header h5 { margin: 0; text-align: center; width: 100%; }
        
        #sidebar .nav-link { 
            color: #bdc3c7; 
            padding: 15px 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            text-decoration: none; 
            cursor: pointer; 
        }
        
        #sidebar .nav-link:hover { background: #2c3e50; color: #fff; } 
        
        .sub-menu { 
            background: #1a252f; 
            list-style: none; 
            padding: 0; 
        }
        
        .sub-menu li a { 
            padding: 10px 40px; 
            display: block; 
            color: #95a5a6; 
            text-decoration: none; 
            font-size: 0.9rem; 
            background-color: #2c3e50;
            transition: 0.2s; 
        }

        .sub-menu li a:hover { 
            color: #fff !important; 
            background-color: #1a252f !important; 
        }
         
        .active-link { 
            color: #fff !important; 
            font-weight: bold; 
            background-color: #1a252f !important; 
            border-left: 4px solid #3498db;      
        }
        
        .rotate { transform: rotate(180deg); transition: 0.3s; }
    </style>
</head>
<body>
    <nav th:fragment="sidebar" id="sidebar">
        <div class="sidebar-header"><h5 class="mb-0">Dashboard</h5></div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item">
                <a class="nav-link menu-toggle" id="toggle-gl">
                    <span><i class="bi bi-grid-fill me-2"></i> GL Master</span>
                    <i class="bi bi-chevron-down small"></i>
                </a>
                <ul class="sub-menu" id="menu-gl">
                    <li><a th:href="@{/gl/add}" id="menu-gl-add">Add New GL</a></li>
                    <li><a th:href="@{/gl/records}" id="menu-gl-records">View GL Records</a></li>
                </ul>
            </li>
            <li class="nav-item">
                <a class="nav-link menu-toggle" id="toggle-pc">
                    <span><i class="bi bi-pc-display me-2"></i> PC Master</span>
                    <i class="bi bi-chevron-down small"></i>
                </a>
                <ul class="sub-menu" id="menu-pc">
                    <li><a th:href="@{/pc/add}" id="menu-pc-add">Add New PC</a></li>
                    <li><a th:href="@{/pc/records}" id="menu-pc-records">View PC Records</a></li>
                </ul>
            </li>      
            
        </ul>
    </nav>
</body>
</html>
